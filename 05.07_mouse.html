<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        document.addEventListener('mousemove', function(event){
            const box = document.createElement('div');
            box.style.position = 'absolute';
            box.style.width = '200px';
            box.style.height = '200px';
            box.style.backgroundColor = 
                `rgba(${Math.ceil(Math.random()*255)}, 
                ${Math.ceil(Math.random()*255)}, 
                ${Math.ceil(Math.random()*255)}, 0.2)`;
                // ${Math.ceil(Math.random()*255)} = 
                // Math.random을 통해 0~1값을 랜덤으로 도출함(무한의 모든 소수)
                // Math.ceil을 통해 (0~1)*255로 0~255값을 만들며 ceil(천장, 올림)으로 정수로 바꿈
            box.style.top = `${event.clientY-100}px`;
            box.style.left = `${event.clientX-100}px`;
            box.style.borderRadius = '50px';

            document.body.appendChild(box);
        })

        let rotate = 0;
        function animate(){
            requestAnimationFrame(animate);
            let boxes = document.querySelectorAll('div');
            rotate += 0.5;
            boxes.forEach(function(box){
                box.style.transform = `rotate(${rotate}deg)`
            })
        }
        animate();
    </script>
</body>
</html>
