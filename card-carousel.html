<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ho Seong Park — Portfolio</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #07070a;
  color: #fff;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  user-select: none;
}

/* ── BLOBS ── */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
}
.blob-1 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #c0341a 0%, #e8701a 55%, transparent 75%);
  top: -60px; left: -80px;
  opacity: 0.45;
}
.blob-2 {
  width: 320px; height: 320px;
  background: radial-gradient(circle, #1a2ec0 0%, #5030d0 60%, transparent 78%);
  bottom: 10%; left: 10%;
  opacity: 0.3;
}

/* ── CANVAS LAYER ── */
#orbit-stage {
  position: fixed;
  inset: 0;
  z-index: 2;
}

/* ── CARD ── */
.orbit-card {
  position: absolute;
  width: 220px;
  height: 300px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  will-change: transform;
  transform-origin: center center;
  cursor: pointer;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.orbit-card:hover {
  border-color: rgba(255,255,255,0.22);
  box-shadow: 0 0 40px 10px var(--glow, rgba(100,100,255,0.3));
}

.orbit-card .c-top {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 16px;
}

.orbit-card .c-top img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #f0f0f2;
}

.c-tags {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.c-tag {
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 2px 8px;
  border-radius: 20px;
}

.orbit-card .c-body {
  flex: none;
  padding: 12px 16px 16px;
  background: rgba(0,0,0,0.3);
}

.c-num   { font-size: 9px; letter-spacing: 0.15em; opacity: 0.3; margin-bottom: 6px; text-transform: uppercase; }
.c-title { font-size: 13px; font-weight: 600; line-height: 1.3; color: rgba(255,255,255,0.9); }
.c-sub   { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 4px; }

/* ── HUD ── */
#hud {
  position: fixed;
  bottom: 32px; right: 36px;
  z-index: 200;
  display: flex;
  gap: 10px;
}

.btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  font-size: 12px;
  font-family: inherit;
  letter-spacing: 0.5px;
  transition: background 0.2s;
}
.btn:hover { background: rgba(255,255,255,0.12); }

#indicator {
  position: fixed;
  bottom: 32px; left: 36px;
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.5px;
  z-index: 200;
  line-height: 1.8;
}

.prog-bar {
  width: 100px; height: 1px;
  background: rgba(255,255,255,0.08);
  margin-top: 6px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: rgba(180,100,255,0.6);
  width: 0%;
  transition: width 0.1s linear;
}

#scroll-hint {
  position: fixed;
  top: 32px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  z-index: 200;
}

/* ── GRID PAGE ── */
#grid-page {
  display: none;
  position: fixed;
  inset: 0;
  overflow-y: auto;
  z-index: 300;
  background: #07070a;
}

#grid-page.show {
  display: block;
  animation: fadeIn 0.6s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; } to { opacity: 1; }
}

.gp-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
}
.gp-blob-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #c0341a 0%, #e8701a 55%, transparent 75%);
  top: -80px; left: -120px; opacity: 0.55;
}
.gp-blob-2 {
  width: 360px; height: 360px;
  background: radial-gradient(circle, #1a2ec0 0%, #5030d0 60%, transparent 78%);
  top: 80px; right: 8%; opacity: 0.35;
}
.gp-blob-3 {
  width: 280px; height: 280px;
  background: radial-gradient(circle, #d04080 0%, #901060 60%, transparent 78%);
  bottom: 30%; right: 20%; opacity: 0.2;
}

#grid-hero {
  position: relative;
  z-index: 2;
  padding: 110px 10vw 80px;
}

.hero-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 28px;
}

.hero-title {
  font-size: clamp(52px, 7.5vw, 110px);
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: #fff;
  margin-bottom: 40px;
}

.hero-title em {
  font-style: italic;
  font-weight: 300;
  color: rgba(255,255,255,0.45);
}

.hero-meta { display: flex; gap: 60px; align-items: flex-start; flex-wrap: wrap; }

.hero-desc {
  font-size: 14px;
  font-weight: 300;
  color: rgba(255,255,255,0.4);
  line-height: 1.8;
  max-width: 380px;
}

.hero-stats { display: flex; gap: 48px; }
.stat-item  { display: flex; flex-direction: column; gap: 4px; }
.stat-num   { font-size: 28px; font-weight: 700; color: #fff; }
.stat-label { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 0.08em; text-transform: uppercase; }

.section-label {
  position: relative;
  z-index: 2;
  padding: 0 10vw 32px;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
}

#grid {
  display: grid;
  width: 100%;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 0 10vw 120px;
  position: relative;
  z-index: 2;
}

.grid-card {
  aspect-ratio: 1 / 1.35;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
}

.grid-card:hover {
  transform: translateY(-6px);
  border-color: rgba(255,255,255,0.15);
  box-shadow: 0 0 60px 16px var(--glow, rgba(100,100,255,0.25));
}

.grid-card .c-top { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 2vw; }
.grid-card .c-top img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #f0f0f2; }
.grid-card .c-body { flex: none; padding: 1vw 2vw 1.8vw; background: rgba(0,0,0,0.2); }
.grid-card .c-num   { font-size: 10px; letter-spacing: 0.15em; opacity: 0.25; margin-bottom: 8px; text-transform: uppercase; }
.grid-card .c-title { font-size: clamp(14px, 1.3vw, 20px); font-weight: 500; line-height: 1.3; color: rgba(255,255,255,0.9); }
.grid-card .c-sub   { font-size: clamp(10px, 0.85vw, 13px); color: rgba(255,255,255,0.3); margin-top: 6px; }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div id="orbit-stage"></div>

<div id="scroll-hint">scroll to rotate</div>

<div id="indicator">
  <div id="ind-text">↻ Auto rotating</div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
</div>

<div id="hud">
  <button class="btn" id="gridBtn">▦ &nbsp;Grid view</button>
</div>

<!-- GRID PAGE -->
<div id="grid-page">
  <div class="gp-blob gp-blob-1"></div>
  <div class="gp-blob gp-blob-2"></div>
  <div class="gp-blob gp-blob-3"></div>

  <div id="grid-hero">
    <p class="hero-label">Portfolio — 2025</p>
    <h1 class="hero-title">Ho Seong<br><em>Park.</em></h1>
    <div class="hero-meta">
      <p class="hero-desc">혁신적인 디자인과 탄탄한 구현력을 지향합니다.<br>막연한 추측이 아닌, 실제 사용자의 행동 패턴을 분석하여 불편함의 본질을 찾아냅니다.</p>
      <div class="hero-stats">
        <div class="stat-item"><span class="stat-num">6</span><span class="stat-label">Projects</span></div>
        <div class="stat-item"><span class="stat-num">100%</span><span class="stat-label">Figma</span></div>
        <div class="stat-item"><span class="stat-num">95%</span><span class="stat-label">HTML/CSS</span></div>
      </div>
    </div>
  </div>

  <p class="section-label">Archive — Project Collection</p>
  <div id="grid"></div>

  <div id="hud2" style="position:fixed;bottom:32px;right:36px;z-index:400;">
    <button class="btn" id="backBtn">↻ &nbsp;Carousel</button>
  </div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────
const PALETTES = [
  { bg: ['#1a1040','#2d1b69'], glow: '#4a30b8' },
  { bg: ['#0d1f3c','#1a3a6b'], glow: '#2a5aad' },
  { bg: ['#2e1f0d','#6b4a1a'], glow: '#b87a28' },
  { bg: ['#0d2e2e','#1a6b6b'], glow: '#28b8b8' },
  { bg: ['#1a0d2e','#3a1a6b'], glow: '#5a2ab8' },
  { bg: ['#2e0d1f','#6b1a3a'], glow: '#b82870' },
];

function hexToRgb(h) {
  return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;
}

const CARD_DATA = [
  { num:'01', title:'KT멤버십 UXUI리디자인', sub:'2025 · UI/UX',           tags:['UI/UX','Figma'],              palette:PALETTES[0], img:'images/01_kt-membership.jpg' },
  { num:'02', title:'Brand Redesign Project',sub:'UI/UX · Figma',          tags:['UI/UX','Figma'],              palette:PALETTES[1], img:null },
  { num:'03', title:'E-Commerce Platform',   sub:'HTML/CSS · JS',           tags:['HTML/CSS','JavaScript'],      palette:PALETTES[2], img:null },
  { num:'04', title:'Promotion Landing Page',sub:'Photoshop · Illustrator', tags:['Photoshop','Illustrator'],    palette:PALETTES[3], img:null },
  { num:'05', title:'Admin Dashboard UI',    sub:'UI Design · Prototyping', tags:['UI Design','Prototyping'],    palette:PALETTES[4], img:null },
  { num:'06', title:'Interactive Web App',   sub:'Interaction · Tailwind',  tags:['Interaction','Tailwind CSS'], palette:PALETTES[5], img:null },
];

// ── ORBIT CONFIG ─────────────────────────────────────────
const N         = CARD_DATA.length;         // 6
const RADIUS    = 300;                      // orbit radius px
const CARD_W    = 220;
const CARD_H    = 300;
// Circle center: far right of viewport so only left arc visible
const getCX     = () => window.innerWidth * 1.08;
const getCY     = () => window.innerHeight * 0.5;

const DEG_PER_CARD   = 360 / N;            // 60°
const RPM            = 4;                  // rotations per minute
const DEG_PER_MS     = (RPM * 360) / 60000;
const GRID_THRESHOLD = 3 * 360;            // 3 full rotations → grid

// ── STATE ────────────────────────────────────────────────
let angle    = 0;   // global orbit angle (degrees)
let accumCCW = 0;   // CCW scroll accumulator for grid trigger
let autoOn   = true;
let lastTs   = null;
let rafId    = null;
let inGrid   = false;

// ── BUILD ORBIT CARDS ────────────────────────────────────
const stage = document.getElementById('orbit-stage');
const cardEls = CARD_DATA.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'orbit-card';
  el.style.background = d.img
    ? 'transparent'
    : `linear-gradient(145deg, ${d.palette.bg[0]} 0%, ${d.palette.bg[1]} 100%)`;
  el.style.setProperty('--glow', `rgba(${hexToRgb(d.palette.glow)},0.4)`);
  el.style.width  = CARD_W + 'px';
  el.style.height = CARD_H + 'px';
  el.style.marginLeft = (-CARD_W / 2) + 'px';
  el.style.marginTop  = (-CARD_H / 2) + 'px';

  const tagHtml = d.tags.map(t => `<span class="c-tag">${t}</span>`).join('');
  el.innerHTML = `
    <div class="c-top">
      ${d.img ? `<img src="${d.img}" alt="${d.title}">` : ''}
      <div class="c-tags">${tagHtml}</div>
    </div>
    <div class="c-body">
      <div class="c-num">${d.num}</div>
      <div class="c-title">${d.title}</div>
      <div class="c-sub">${d.sub}</div>
    </div>`;
  stage.appendChild(el);
  return el;
});

// ── BUILD GRID CARDS ─────────────────────────────────────
const gridEl = document.getElementById('grid');
CARD_DATA.forEach(d => {
  const el = document.createElement('div');
  el.className = 'grid-card';
  el.style.background = d.img
    ? 'transparent'
    : `linear-gradient(145deg, ${d.palette.bg[0]} 0%, ${d.palette.bg[1]} 100%)`;
  el.style.setProperty('--glow', `rgba(${hexToRgb(d.palette.glow)},0.35)`);
  const tagHtml = d.tags.map(t => `<span class="c-tag">${t}</span>`).join('');
  el.innerHTML = `
    <div class="c-top">
      ${d.img ? `<img src="${d.img}" alt="${d.title}">` : ''}
      <div class="c-tags">${tagHtml}</div>
    </div>
    <div class="c-body">
      <div class="c-num">${d.num}</div>
      <div class="c-title">${d.title}</div>
      <div class="c-sub">${d.sub}</div>
    </div>`;
  gridEl.appendChild(el);
});

// ── POSITION CARDS ───────────────────────────────────────
function positionCards(globalAngle) {
  const cx = getCX();
  const cy = getCY();
  const toRad = Math.PI / 180;

  cardEls.forEach((el, i) => {
    const theta = (globalAngle + i * DEG_PER_CARD) * toRad;
    const x = cx + RADIUS * Math.cos(theta);
    const y = cy + RADIUS * Math.sin(theta);
    // card tilt follows orbit tangent
    const tiltDeg = globalAngle + i * DEG_PER_CARD + 90;
    // depth: cards on left arc (cos(theta) < 0) are "visible" side
    const cosT = Math.cos(theta);
    const opacity = cosT < 0 ? 1 : Math.max(0, 1 + cosT * 3); // fade as they go right
    el.style.transform = `translate(${x}px, ${y}px) rotate(${tiltDeg}deg)`;
    el.style.opacity = opacity;
  });
}

// ── INDICATOR ────────────────────────────────────────────
const indText = document.getElementById('ind-text');
const progEl  = document.getElementById('prog');
function updateInd(text, pct) {
  indText.textContent = text;
  progEl.style.width = Math.min(100, pct) + '%';
}

// ── AUTO LOOP ────────────────────────────────────────────
function autoLoop(ts) {
  if (!autoOn) return;
  if (!lastTs) lastTs = ts;
  const dt = ts - lastTs;
  lastTs = ts;

  const step = DEG_PER_MS * dt;
  angle -= step;           // CW rotation
  accumCCW += step;        // treat auto as accumulating toward grid
  positionCards(angle);

  const pct  = (accumCCW / GRID_THRESHOLD) * 100;
  const rots = (accumCCW / 360).toFixed(2);
  updateInd(`↻ Auto  ${rots} / 3 rotations`, pct);

  if (accumCCW >= GRID_THRESHOLD) { toGrid(); return; }
  rafId = requestAnimationFrame(autoLoop);
}

function pauseAuto() {
  autoOn = false;
  cancelAnimationFrame(rafId);
  lastTs = null;
}

let resumeTimer = null;
function scheduleResume() {
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    if (!inGrid) {
      autoOn = true;
      lastTs = null;
      rafId  = requestAnimationFrame(autoLoop);
    }
  }, 200);
}

// ── SCROLL ───────────────────────────────────────────────
window.addEventListener('wheel', e => {
  if (inGrid) return;
  e.preventDefault();
  pauseAuto();
  scheduleResume();

  const delta = e.deltaY * 0.12;
  angle -= delta;
  accumCCW += Math.abs(delta);
  positionCards(angle);

  const pct  = (accumCCW / GRID_THRESHOLD) * 100;
  const rots = (accumCCW / 360).toFixed(2);
  updateInd(`↺ Scroll  ${rots} / 3 rotations`, pct);

  if (accumCCW >= GRID_THRESHOLD) toGrid();
}, { passive: false });

// ── TRANSITIONS ──────────────────────────────────────────
function toGrid() {
  if (inGrid) return;
  inGrid = true;
  pauseAuto();
  document.getElementById('grid-page').classList.add('show');
  document.getElementById('scroll-hint').style.opacity = '0';
  document.getElementById('indicator').style.opacity  = '0';
  document.getElementById('hud').style.opacity        = '0';
}

function toCarousel() {
  if (!inGrid) return;
  inGrid = false;
  document.getElementById('grid-page').classList.remove('show');
  document.getElementById('scroll-hint').style.opacity = '1';
  document.getElementById('indicator').style.opacity  = '1';
  document.getElementById('hud').style.opacity        = '1';
  accumCCW = 0;
  autoOn   = true;
  lastTs   = null;
  rafId    = requestAnimationFrame(autoLoop);
}

document.getElementById('gridBtn').addEventListener('click', toGrid);
document.getElementById('backBtn').addEventListener('click', toCarousel);

// ── RESIZE ───────────────────────────────────────────────
window.addEventListener('resize', () => positionCards(angle));

// ── START ────────────────────────────────────────────────
positionCards(angle);
rafId = requestAnimationFrame(autoLoop);
</script>
</body>
</html>
