<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ho Seong Park — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #07070a;
  color: #fff;
  font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
  overflow-x: hidden;
}

/* ── BLOBS ── */
.gp-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
}
.gp-blob-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #c0341a 0%, #e8701a 55%, transparent 75%);
  top: -80px; left: -120px;
  opacity: 0.55;
}
.gp-blob-2 {
  width: 360px; height: 360px;
  background: radial-gradient(circle, #1a2ec0 0%, #5030d0 60%, transparent 78%);
  top: 80px; right: 8%;
  opacity: 0.35;
}
.gp-blob-3 {
  width: 280px; height: 280px;
  background: radial-gradient(circle, #d04080 0%, #901060 60%, transparent 78%);
  bottom: 30%; right: 20%;
  opacity: 0.2;
}

/* ── HERO ── */
#grid-hero {
  position: relative;
  z-index: 2;
  padding: 110px 10vw 80px;
}

.hero-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 28px;
}

.hero-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(52px, 7.5vw, 110px);
  font-weight: 400;
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: #fff;
  margin-bottom: 40px;
}

.hero-title em {
  font-style: italic;
  font-weight: 300;
  color: rgba(255,255,255,0.5);
}

.hero-meta {
  display: flex;
  gap: 60px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.hero-desc {
  font-size: 14px;
  font-weight: 300;
  color: rgba(255,255,255,0.4);
  line-height: 1.8;
  max-width: 380px;
}

.hero-stats { display: flex; gap: 48px; }
.stat-item  { display: flex; flex-direction: column; gap: 4px; }
.stat-num   { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
.stat-label { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 0.08em; text-transform: uppercase; }

/* ── SECTION LABEL ── */
.section-label {
  position: relative;
  z-index: 2;
  padding: 0 10vw 32px;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
}

/* ── GRID ── */
#grid {
  display: grid;
  width: 100%;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 0 10vw 120px;
  position: relative;
  z-index: 2;
}

.grid-card {
  aspect-ratio: 1 / 1.35;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
  background: rgba(255,255,255,0.03);
  animation: fadeInUp 0.5s ease both;
}

.grid-card:nth-child(1) { animation-delay: 0.05s; }
.grid-card:nth-child(2) { animation-delay: 0.10s; }
.grid-card:nth-child(3) { animation-delay: 0.15s; }
.grid-card:nth-child(4) { animation-delay: 0.20s; }
.grid-card:nth-child(5) { animation-delay: 0.25s; }
.grid-card:nth-child(6) { animation-delay: 0.30s; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.grid-card:hover {
  transform: translateY(-6px);
  border-color: rgba(255,255,255,0.15);
  box-shadow: 0 0 60px 16px var(--glow, rgba(100,100,255,0.25));
}

.grid-card .card-top {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 2vw;
  position: relative;
  overflow: hidden;
}

.grid-card .card-top img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #f0f0f2;
}

.card-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.card-tag {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 3px 10px;
  border-radius: 20px;
}

.grid-card .card-body {
  flex: none;
  padding: 1vw 2vw 1.8vw;
  background: rgba(0,0,0,0.2);
}

.grid-card .card-num   { font-size: 10px; letter-spacing: 0.15em; opacity: 0.25; margin-bottom: 8px; text-transform: uppercase; }
.grid-card .card-title { font-size: clamp(14px, 1.3vw, 20px); font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; color: rgba(255,255,255,0.9); }
.grid-card .card-sub   { font-size: clamp(10px, 0.85vw, 13px); color: rgba(255,255,255,0.3); margin-top: 6px; }

@media (max-width: 768px) {
  #grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 5vw 80px; }
  #grid-hero { padding: 80px 5vw 48px; }
  .section-label { padding: 0 5vw 20px; }
  .hero-meta { flex-direction: column; gap: 28px; }
}
</style>
</head>
<body>

<div class="gp-blob gp-blob-1"></div>
<div class="gp-blob gp-blob-2"></div>
<div class="gp-blob gp-blob-3"></div>

<div id="grid-hero">
  <p class="hero-label">Portfolio — 2025</p>
  <h1 class="hero-title">Ho Seong<br><em>Park.</em></h1>
  <div class="hero-meta">
    <p class="hero-desc">혁신적인 디자인과 탄탄한 구현력을 지향합니다.<br>막연한 추측이 아닌, 실제 사용자의 행동 패턴을 분석하여 불편함의 본질을 찾아냅니다.</p>
    <div class="hero-stats">
      <div class="stat-item"><span class="stat-num">6</span><span class="stat-label">Projects</span></div>
      <div class="stat-item"><span class="stat-num">100%</span><span class="stat-label">Figma</span></div>
      <div class="stat-item"><span class="stat-num">95%</span><span class="stat-label">HTML/CSS</span></div>
    </div>
  </div>
</div>

<p class="section-label">Archive — Project Collection</p>
<div id="grid"></div>

<script>
const PALETTES = [
  { bg: ['#1a1040','#2d1b69'], glow: '#4a30b8' },
  { bg: ['#0d1f3c','#1a3a6b'], glow: '#2a5aad' },
  { bg: ['#2e1f0d','#6b4a1a'], glow: '#b87a28' },
  { bg: ['#0d2e2e','#1a6b6b'], glow: '#28b8b8' },
  { bg: ['#1a0d2e','#3a1a6b'], glow: '#5a2ab8' },
  { bg: ['#2e0d1f','#6b1a3a'], glow: '#b82870' },
];

function hexToRgb(hex) {
  return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;
}

const CARD_DATA = [
  { num:'01', title:'KT멤버십 UXUI리디자인',  sub:'2025 · UI/UX',           tags:['UI/UX','Figma'],              palette:PALETTES[0], img:'images/01_kt-membership.jpg' },
  { num:'02', title:'Brand Redesign Project',  sub:'UI/UX · Figma',          tags:['UI/UX','Figma'],              palette:PALETTES[1], img:null },
  { num:'03', title:'E-Commerce Platform',     sub:'HTML/CSS · JS',           tags:['HTML/CSS','JavaScript'],      palette:PALETTES[2], img:null },
  { num:'04', title:'Promotion Landing Page',  sub:'Photoshop · Illustrator', tags:['Photoshop','Illustrator'],    palette:PALETTES[3], img:null },
  { num:'05', title:'Admin Dashboard UI',      sub:'UI Design · Prototyping', tags:['UI Design','Prototyping'],    palette:PALETTES[4], img:null },
  { num:'06', title:'Interactive Web App',     sub:'Interaction · Tailwind',  tags:['Interaction','Tailwind CSS'], palette:PALETTES[5], img:null },
];

const gridEl = document.getElementById('grid');
CARD_DATA.forEach(d => {
  const card = document.createElement('div');
  card.className = 'grid-card';
  card.style.background = d.img ? 'transparent' : `linear-gradient(145deg, ${d.palette.bg[0]} 0%, ${d.palette.bg[1]} 100%)`;
  card.style.setProperty('--glow', `rgba(${hexToRgb(d.palette.glow)},0.35)`);
  const tagHtml = d.tags.map(t => `<span class="card-tag">${t}</span>`).join('');
  card.innerHTML = `
    <div class="card-top">
      ${d.img ? `<img src="${d.img}" alt="${d.title}">` : ''}
      <div class="card-tags">${tagHtml}</div>
    </div>
    <div class="card-body">
      <div class="card-num">${d.num}</div>
      <div class="card-title">${d.title}</div>
      <div class="card-sub">${d.sub}</div>
    </div>`;
  gridEl.appendChild(card);
});
</script>
</body>
</html>
