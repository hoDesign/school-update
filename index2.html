<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>물리엔진 인터랙티브 볼 - 현실적인 글라스모피즘</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 스크롤 방지 */
            background-color: #050508; /* 더 깊은 심연의 블랙 */
            background-image: radial-gradient(circle at 50% 50%, #151525 0%, #050508 100%);
            touch-action: none; /* 모바일 터치 스크롤 방지 */
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-text {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            pointer-events: none;
            user-select: none;
            /* 2026 트렌드: 글래스모피즘 UI */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 32px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        #ui-text h2 {
            margin: 0 0 12px 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            /* 텍스트 그라디언트 */
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #ui-text p {
            margin: 6px 0;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div id="ui-text">
        <h2>현실적인 물리엔진 방</h2>
        <p>✨ 마우스를 이리저리 흔들어 공들을 쳐보세요.</p>
        <p>💥 화면을 클릭하여 폭발을 일으켜보세요!</p>
    </div>

    <canvas id="physicsCanvas"></canvas>

    <script>
        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const balls = [];
        
        // 물리 환경 설정 (현실적인 움직임을 위해 값 조정)
        const GRAVITY = 0.15; // 중력 약간 감소
        const FRICTION = 0.98; // 마찰력 증가 (더 빨리 감속)
        const BOUNCE = 0.6; // 탄성 감소 (덜 튀어오름)

        // 마우스 및 마우스 공 설정
        const mouse = {
            x: -1000, 
            y: -1000, 
            targetX: -1000, 
            targetY: -1000,
            vx: 0,
            vy: 0,
            radius: 105, // 크기 3배 증가 (35 * 3)
            mass: 1000000, // 아주 무거운 질량으로 다른 공들을 밀어냄
            trail: [],     // 🌟 잔상 저장을 위한 배열
            angle: 0,      // 🌟 회전 각도
            hue: 0         // 🌟 다채로운 색상을 위한 색조(Hue) 값
        };

        // 화면 크기 초기화
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 마우스 및 터치 이벤트 처리
        function updateMouseTarget(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.targetX = clientX;
            mouse.targetY = clientY;
        }

        window.addEventListener('mousemove', updateMouseTarget);
        window.addEventListener('touchmove', updateMouseTarget);

        // 폭발 이벤트 (클릭)
        function explode() {
            const EXPLOSION_RADIUS = 500; // 폭발 영향 반경 증가
            const EXPLOSION_FORCE = 30;  // 폭발 힘 약간 감소

            balls.forEach(ball => {
                const dx = ball.x - mouse.x;
                const dy = ball.y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 0 && distance < EXPLOSION_RADIUS) {
                    // 마우스 좌표와 가까울수록 강한 힘을 받음
                    const force = (EXPLOSION_RADIUS - distance) / EXPLOSION_RADIUS * EXPLOSION_FORCE;
                    ball.vx += (dx / distance) * force;
                    ball.vy += (dy / distance) * force;
                }
            });
        }

        window.addEventListener('mousedown', explode);
        window.addEventListener('touchstart', (e) => {
            updateMouseTarget(e);
            // 터치 후 바로 폭발하도록 딜레이 미세 조정
            setTimeout(explode, 50);
        });

        // 공 클래스
        class Ball {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5; // 초기 속도 감소
                this.vy = (Math.random() - 0.5) * 5; // 초기 속도 감소
                this.radius = radius;
                this.mass = radius * radius; // 질량은 넓이에 비례
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                
                // 글라스모피즘 스타일의 진주/구슬 렌더링
                // 1. 기본 구체 그라디언트 (흰색 -> 회색)
                const grad = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, 
                    this.y - this.radius * 0.3, 
                    this.radius * 0.1,
                    this.x, 
                    this.y, 
                    this.radius
                );
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)'); // 중심 하이라이트
                grad.addColorStop(0.6, 'rgba(220, 220, 230, 1)'); // 중간 톤
                grad.addColorStop(1, 'rgba(150, 150, 170, 1)'); // 외곽 쉐도우
                
                ctx.fillStyle = grad;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // 2. 추가 하이라이트 (유리 질감 강조)
                ctx.beginPath();
                const highlightGrad = ctx.createRadialGradient(
                    this.x - this.radius * 0.4,
                    this.y - this.radius * 0.4,
                    this.radius * 0.05,
                    this.x - this.radius * 0.4,
                    this.y - this.radius * 0.4,
                    this.radius * 0.4
                );
                highlightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                highlightGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.fillStyle = highlightGrad;
                ctx.arc(this.x - this.radius * 0.4, this.y - this.radius * 0.4, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // 3. 하단 반사광 (입체감 추가)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.85, Math.PI * 0.3, Math.PI * 0.7);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = this.radius * 0.05;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.restore();
            }

            update() {
                // 중력 및 마찰 적용
                this.vy += GRAVITY;
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                // 극한의 속도로 인한 물리엔진 붕괴 방지 (최대 속도 제한)
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > 30) { // 최대 속도 제한도 낮춤
                    this.vx = (this.vx / speed) * 30;
                    this.vy = (this.vy / speed) * 30;
                }

                this.x += this.vx;
                this.y += this.vy;

                // 벽 충돌 (X축)
                if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx *= -BOUNCE;
                } else if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -BOUNCE;
                }

                // 바닥 & 천장 충돌 (Y축)
                if (this.y + this.radius > height) {
                    this.y = height - this.radius;
                    this.vy *= -BOUNCE;
                } else if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -BOUNCE;
                }
            }
        }

        // 두 원 사이의 충돌 해결 (탄성 충돌 수학)
        function resolveCollision(ballA, ballB) {
            let dx = ballB.x - ballA.x;
            let dy = ballB.y - ballA.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            // 안전 장치: 완전히 겹쳤을 때 NaN 오류로 공이 사라지는 현상 방지
            if (distance === 0) {
                dx = (Math.random() - 0.5) * 0.1;
                dy = (Math.random() - 0.5) * 0.1;
                distance = Math.sqrt(dx * dx + dy * dy);
            }

            const minDistance = ballA.radius + ballB.radius;

            // 두 공이 겹쳤을 경우
            if (distance < minDistance) {
                // 1. 겹친 부분을 분리 (Overlap resolution)
                const overlap = minDistance - distance;
                const nx = dx / distance;
                const ny = dy / distance;

                const totalMass = ballA.mass + ballB.mass;
                const ratioA = ballB.mass / totalMass;
                const ratioB = ballA.mass / totalMass;

                // ballA가 마우스인 경우 위치를 고정시키고 ballB만 밀어냄
                if (ballA === mouse) {
                    ballB.x += nx * overlap;
                    ballB.y += ny * overlap;
                } else if (ballB === mouse) {
                    ballA.x -= nx * overlap;
                    ballA.y -= ny * overlap;
                } else {
                    ballA.x -= nx * overlap * ratioA;
                    ballA.y -= ny * overlap * ratioA;
                    ballB.x += nx * overlap * ratioB;
                    ballB.y += ny * overlap * ratioB;
                }

                // 2. 탄성 충돌에 의한 속도 변환 (Velocity resolution)
                const rvx = ballB.vx - ballA.vx;
                const rvy = ballB.vy - ballA.vy;
                
                // 두 공이 서로 멀어지고 있다면 충돌 계산 생략
                const velocityAlongNormal = rvx * nx + rvy * ny;
                if (velocityAlongNormal > 0) return;

                const restitution = 0.6; // 공끼리의 탄성계수 감소 (더 많은 에너지 손실)
                
                let j = -(1 + restitution) * velocityAlongNormal;
                j /= (1 / ballA.mass + 1 / ballB.mass);

                const impulseX = j * nx;
                const impulseY = j * ny;

                if (ballA !== mouse) {
                    ballA.vx -= impulseX / ballA.mass;
                    ballA.vy -= impulseY / ballA.mass;
                }
                if (ballB !== mouse) {
                    ballB.vx += impulseX / ballB.mass;
                    ballB.vy += impulseY / ballB.mass;
                }
            }
        }

        // 초기 공 생성
        function initBalls() {
            // 화면 면적에 비례하여 적절한 개수의 공 생성 (최소값 보장) - 수량은 그대로 유지
            let numBalls = Math.min(Math.floor((width * height) / 12000), 150);
            if (numBalls <= 0) numBalls = 50; // 로딩 지연으로 크기가 0일 때를 대비한 기본값

            for (let i = 0; i < numBalls; i++) {
                // 크기 3배 증가: 기존 10~30 -> 30~90
                const radius = (Math.random() * 5 + 10) * 3; 
                const x = Math.random() * (width - radius * 2) + radius;
                const y = Math.random() * (height - radius * 2) + radius;
                balls.push(new Ball(x, y, radius));
            }
        }

        // 마우스 볼 그리기 (다채로운 색상의 회전 잔상 효과 적용)
        function drawMouse() {
            // 마우스를 부드럽게 따라오도록 스프링 효과 적용
            if (mouse.targetX !== -1000) {
                const dx = mouse.targetX - mouse.x;
                const dy = mouse.targetY - mouse.y;
                
                // 마우스의 속도 벡터 계산 (물리 엔진 적용을 위해)
                mouse.vx = dx * 0.2; // 반응 속도 약간 감소
                mouse.vy = dy * 0.2;
                
                mouse.x += mouse.vx;
                mouse.y += mouse.vy;
            }

            // 🌟 지속적인 회전 및 색상 변화
            mouse.angle += 0.15;
            mouse.hue = (mouse.hue + 4) % 360;

            // 🌟 현재 마우스 상태를 잔상 배열에 기록
            mouse.trail.push({ 
                x: mouse.x, 
                y: mouse.y, 
                angle: mouse.angle, 
                hue: mouse.hue 
            });

            // 🌟 꼬리(잔상) 길이 유지
            if (mouse.trail.length > 25) {
                mouse.trail.shift();
            }

            ctx.save();
            
            // 겹칠 때 색이 밝아지는 가산 혼합(Lighter) 모드
            ctx.globalCompositeOperation = 'lighter';

            // 1. 잔상(Trail) 그리기
            for (let i = 0; i < mouse.trail.length; i++) {
                const point = mouse.trail[i];
                
                // 꼬리 부분(i가 0에 가까울수록) 투명해지고 작아짐
                const opacity = (i / mouse.trail.length) * 0.6; 
                const scale = (i / mouse.trail.length) * 0.8 + 0.2;

                ctx.save();
                ctx.translate(point.x, point.y);
                ctx.rotate(point.angle);
                ctx.scale(scale, scale);

                const offset = mouse.radius * 0.15;
                const r = mouse.radius * 0.12;

                // 3개의 회전하는 다채로운 빛의 원형 생성
                for(let j = 0; j < 3; j++) {
                    ctx.rotate((Math.PI * 2) / 3);
                    ctx.beginPath();
                    
                    // 각 원마다 색상 각도를 다르게 주어 다채로운 빛을 섞음
                    const currentHue = (point.hue + j * 120) % 360;
                    ctx.fillStyle = `hsla(${currentHue}, 100%, 65%, ${opacity})`;
                    ctx.shadowColor = `hsla(${currentHue}, 100%, 65%, ${opacity})`;
                    ctx.shadowBlur = 15;
                    
                    ctx.arc(offset, offset, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // 2. 가장 중심의 강렬한 화이트 코어 발광
            ctx.beginPath();
            ctx.shadowColor = 'rgba(255, 255, 255, 0.8)'; 
            ctx.shadowBlur = 20; 
            ctx.arc(mouse.x, mouse.y, mouse.radius * 0.15, 0, Math.PI * 2); 
            ctx.fillStyle = 'rgba(255, 255, 255, 1)'; 
            ctx.fill();
            
            ctx.restore();
        }

        // 메인 애니메이션 루프
        function animate() {
            // 이전 프레임 지우기 (약간의 잔상을 위해 투명도 적용 가능하지만 깔끔함을 위해 clearRect 사용)
            ctx.clearRect(0, 0, width, height);

            // 공 업데이트 및 충돌 검사
            for (let i = 0; i < balls.length; i++) {
                balls[i].update();
                balls[i].draw();

                // 마우스와의 충돌 검사
                resolveCollision(mouse, balls[i]);

                // 다른 공들과의 충돌 검사 (이중 루프)
                for (let j = i + 1; j < balls.length; j++) {
                    resolveCollision(balls[i], balls[j]);
                }
            }

            // 가장 마지막에 마우스를 그려서 항상 위에 보이게 함
            if (mouse.targetX !== -1000) {
                drawMouse();
            }

            requestAnimationFrame(animate);
        }

        initBalls();
        animate();

    </script>
</body>
</html>
